{% extends 'gallery/base.html' %}
{% block content %}
<div style="max-width:420px;margin:40px auto;padding:20px" class="card">
  <h2 style="font-weight:700">Sign in to BlaqVibes</h2>
  <form method="post" style="margin-top:12px;display:grid;gap:10px">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn-violet" type="submit">Sign in</button>
  </form>
  <div style="margin-top:10px;font-size:13px;color:#9A9AAF">No account? <a href="{% url 'signup' %}" style="color:#7C3AED">Sign up</a></div>
</div>
<link rel="stylesheet" href="/static/gallery/css/forms.css">
{% endblock %}
