{% extends 'gallery/base.html' %}
{% block title %}Reset password — BlaqVibes{% endblock %}
{% block content %}
<div class="auth-wrap card" style="padding:24px">
  <h2 style="font-weight:700">Reset your password</h2>
  <p class="help" style="margin:8px 0 16px">Enter the email on your account. We'll send a reset link if it matches.</p>
  <form method="post" style="display:grid;gap:12px">{% csrf_token %}
    <div>
      <label class="field-label" for="id_email">Email</label>
      {{ form.email }}
      {{ form.email.errors }}
    </div>
    <button class="btn-violet" type="submit" style="width:100%;justify-content:center">Send reset link</button>
  </form>
  <div class="help" style="margin-top:14px"><a href="{% url 'login' %}" style="color:#7C3AED">← Back to sign in</a></div>
</div>
<link rel="stylesheet" href="/static/gallery/css/forms.css">
{% endblock %}
