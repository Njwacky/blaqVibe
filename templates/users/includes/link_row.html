{# One "your websites" row in the Edit Profile editor.
   Rendered once per existing/new formset form, and once inside the
   inert <template> with __prefix__ placeholders for the JS "Add a
   website" button — identical markup either way, so a row cloned in the
   browser validates exactly like a row the server rendered. #}
<div class="link-row" data-link-row>
  <div class="link-row-main">
    <div class="link-cell">
      <label class="field-label" for="{{ f.label.id_for_label }}">Display name</label>
      {{ f.label }}
    </div>
    <div class="link-cell link-cell--url">
      <label class="field-label" for="{{ f.url.id_for_label }}">URL</label>
      {{ f.url }}
    </div>
    <div class="link-cell link-cell--status">
      <label class="field-label" for="{{ f.status.id_for_label }}">Status</label>
      {{ f.status }}
    </div>
    <button type="button" class="link-remove" data-link-remove title="Remove this link" aria-label="Remove this link">✕</button>
  </div>
  {# Shown only when the status is Moved — the row must say where it went. #}
  <div class="link-cell link-cell--moved" data-link-moved-to-wrap {% if f.instance.status != 'moved' %}hidden{% endif %}>
    <label class="field-label" for="{{ f.moved_to.id_for_label }}">New address (where the site lives now)</label>
    {{ f.moved_to }}
  </div>
  {% if f.errors %}
  <div class="link-row-errors">{{ f.errors }}</div>
  {% endif %}
  <div style="display:none">{{ f.id }}{{ f.DELETE }}</div>
</div>
