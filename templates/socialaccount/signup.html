{% extends 'gallery/base.html' %}
{% block title %}Finish social signup — BlaqVibes{% endblock %}
{% block content %}
<div class="auth-wrap card" style="padding:24px">
  <h2 style="font-weight:700">Almost there</h2>
  <p class="help" style="margin:8px 0 16px">Pick a BlaqVibes username to finish signing in with {{ account.get_provider.name }}.</p>
  <form method="post" style="display:grid;gap:12px">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn-violet" type="submit" style="width:100%;justify-content:center">Create account</button>
  </form>
</div>
<link rel="stylesheet" href="/static/gallery/css/forms.css">
{% endblock %}
