<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oops — Wrong Turn — BlaqVibes</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<script>
try {
  var theme = localStorage.getItem('blaq-theme');
  if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
} catch (e) {}
</script>
<link rel="stylesheet" href="/static/gallery/css/error.css?v=theme-20260815">
</head>
<body>
<div class="card">
  <img src="/static/branding/error-fork.png" alt="Confused at fork" style="width:100%;max-width:420px;border-radius:16px;border:1px solid var(--line)">
  <div style="margin-top:12px;font-family:Space Grotesk,sans-serif;font-size:22px;font-weight:700">Oops — wrong turn?</div>
  <div style="margin-top:6px;color:var(--muted);font-size:13px;line-height:1.6">
    It’s not you, it’s me. You accidentally clicked a wrong button.<br>
    That page doesn’t exist or you shouldn’t be there — no worries, I got you.
  </div>
  <div style="margin-top:14px;display:flex;gap:8px;justify-content:center">
    <a href="/" style="background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;text-decoration:none">🏠 Home — Safe Way</a>
    <a href="javascript:history.back()" style="border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:10px;font-weight:600;text-decoration:none">← Go Back</a>
  </div>
</div>
</body>
</html>
