{% if social_providers %}
<div class="social-auth">
  <div class="social-auth-divider">
    <span>{% if social_connect %}connect an account{% else %}or continue with{% endif %}</span>
  </div>
  {% for p in social_providers %}
  <form
    method="post"
    action="/accounts/social/{{ p.id }}/login/?process={% if social_connect %}connect{% else %}login{% endif %}"
  >
    {% csrf_token %}
    {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}" />{% endif %}
    <button type="submit" class="btn-social btn-social-{{ p.id }}">
      {% if social_connect %}Connect {{ p.label|cut:"Continue with " }}{% else %}{{ p.label }}{% endif %}
    </button>
  </form>
  {% endfor %}
</div>
{% endif %}
