<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — {{ project.title }}</title>
<script>
try {
  var theme = localStorage.getItem('blaq-theme');
  if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
} catch (e) {}
</script>
<style>
:root, :root[data-theme="dark"] { color-scheme:dark; --bg:#0A0A0F; --text:#E5E7EB; --muted:#9CA3AF; }
:root[data-theme="light"] { color-scheme:light; --bg:#F4F4F7; --text:#111118; --muted:#62626E; }
body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
</style>
</head>
<body>
<div style="max-width:360px;text-align:center;padding:24px">
  <div style="font-size:40px">🔒</div>
  <div style="font-weight:700;font-size:18px;margin-top:8px">Preview runs in a sandbox</div>
  <div style="font-size:13px;color:var(--muted);margin-top:6px">For safety, live previews only run inside the sandboxed preview page. Open the vibe and press <b>Preview</b> to see it.</div>
</div>
</body>
</html>
