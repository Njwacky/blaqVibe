<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ project.title }} — preview</title>
<link rel="stylesheet" href="/static/gallery/css/preview.css?v=ext-20260827">
</head>
<body>
{% if run_mode == 'static_zip' %}
<iframe sandbox="allow-scripts" referrerpolicy="same-origin" src="{% url 'run_static' project.slug %}?t={{ snippet_token|urlencode }}" title="{{ project.title }} preview"></iframe>
{% else %}
<iframe sandbox="allow-scripts" referrerpolicy="same-origin" src="{% url 'snippet_doc' project.slug %}?t={{ snippet_token|urlencode }}" title="{{ project.title }} preview"></iframe>
{% endif %}
</body>
</html>
