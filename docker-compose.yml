services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blaqvibes
      POSTGRES_USER: blaq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blaq123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blaq"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Gitea removed. 5 Whys: Why? It ran on :3000 and :2222 with zero Python
  # integration — an unpatched, unused attack surface. Git hosting comes
  # back as a service the app actually calls, or not at all.

  web:
    build: .
    command: bash -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py seed_demo && gunicorn blaqvibes.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://blaq:${POSTGRES_PASSWORD:-blaq123}@db:5432/blaqvibes
      - REDIS_URL=redis://redis:6379/0
      - CELERY_EAGER=0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    command: celery -A blaqvibes worker -Q scan --loglevel=info -c 2
    volumes:
      - .:/app
      - media:/app/media
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_EAGER=0
    depends_on: [redis, db]

  celery-beat:
    build: .
    command: celery -A blaqvibes beat --loglevel=info
    volumes:
      - .:/app
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on: [redis, db]

volumes:
  pgdata:
  media:
