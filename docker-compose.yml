# Default deployment: Postgres-backed caches and scans, no Redis service.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blaqvibes
      POSTGRES_USER: blaq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blaq"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    command: bash -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py security_check && gunicorn blaqvibes.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -"
    volumes:
      - media:/app/media
    # nginx/Caddy/cloud TLS proxy goes in front of the local Gunicorn port.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://blaq:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/blaqvibes
      - SCAN_QUEUE_BACKEND=database
      - USE_REDIS=0
      - CELERY_EAGER=0
      - DJANGO_BEHIND_TLS_PROXY=1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  scan-worker:
    build: .
    restart: unless-stopped
    command: python manage.py process_scan_queue --watch --limit 20
    volumes:
      - media:/app/media
    env_file: .env
    environment:
      - DATABASE_URL=postgres://blaq:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/blaqvibes
      - SCAN_QUEUE_BACKEND=database
      - USE_REDIS=0
      - CELERY_EAGER=0
    depends_on:
      db:
        condition: service_healthy
      # The web startup runs migrations before accepting health checks.
      web:
        condition: service_healthy
    stop_grace_period: 60s

volumes:
  pgdata:
  media:
